<div class="table-container">

  <h2>📊 Water Data Table</h2>

  <!-- ✅ Loading -->
  <p *ngIf="loading">⏳ Loading data...</p>

  <!-- ✅ Message (no data / error) -->
  <p *ngIf="!loading && message">{{message}}</p>

  <!-- ✅ Table -->
  <table *ngIf="!loading && records.length > 0">
    <thead>
      <tr>
        <th>Area</th>
        <th>pH</th>
        <th>Turbidity</th>
        <th>Temperature</th>
        <th>Quality</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let d of records">
        <td>{{d.area}}</td>
        <td>{{d.ph}}</td>
        <td>{{d.turbidity}}</td>
        <td>{{d.temperature}}</td>
        <td
          [ngClass]="{
            'good': d.quality === 'Good',
            'poor': d.quality === 'Poor'
          }">
          {{d.quality}}
        </td>
      </tr>
    </tbody>
  </table>

</div>
